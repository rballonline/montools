# Builds montools for Windows, Linux and macOS when a version tag (v1.2.3) is pushed,
# and publishes a GitHub release with installers and portable archives.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libudev-dev patchelf

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build app and installers, upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: montools ${{ env.TAG }}
          releaseBody: |
            **Windows**: `montools_*_windows-x64_portable.zip` (unzip and run, no install) or the `-setup.exe` installer.
            **Linux**: `.AppImage` (chmod +x and run), `.deb` or `.rpm`. See the README for i2c setup.
            **macOS** (Apple Silicon, untested): `.dmg`. The app is unsigned, so right-click → Open the first time.

            `montools-cli` is included in the portable archives.
          releaseDraft: true

      - name: Portable archive (app + CLI)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml --bin montools-cli
          cd src-tauri/target/release
          name="montools_${TAG#v}_${{ matrix.name }}_portable"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" montools.exe montools-cli.exe
            gh release upload "$TAG" "$name.zip" --clobber -R "$GITHUB_REPOSITORY"
          else
            tar czf "$name.tar.gz" montools montools-cli
            gh release upload "$TAG" "$name.tar.gz" --clobber -R "$GITHUB_REPOSITORY"
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --draft=false -R "$GITHUB_REPOSITORY"
